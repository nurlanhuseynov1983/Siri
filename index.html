<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d14"><link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Siri</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0d0d14;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:10px}
canvas{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#err{min-height:20px;font-size:13px;color:#ffb0b8;padding:4px 20px;text-align:center}
#mic{width:80px;height:80px;border-radius:50%;border:0;background:#f4f4f8;color:#14141f;font-size:32px;box-shadow:0 0 0 0 rgba(255,255,255,.5)}
#mic.on{animation:p 1.1s infinite;background:#8fd3ff}
@keyframes p{70%{box-shadow:0 0 0 24px rgba(143,211,255,0)}100%{box-shadow:0 0 0 0 rgba(143,211,255,0)}}
#gear{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;background:rgba(0,0,0,.35);border:0;color:#fff;font-size:22px;border-radius:50%;width:40px;height:40px;z-index:5}
#make{position:absolute;padding:16px 26px;font-size:17px;border:0;border-radius:14px;background:#f4f4f8;color:#14141f;display:none}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
</style></head><body>
<button id="gear" aria-label="Ayarlar">⚙</button>
<div id="wrap"><canvas id="cv" width="600" height="800"></canvas><button id="make">Yüzünü oluştur</button></div>
<div id="err"></div>
<button id="mic" aria-label="Konuş">🎤</button>
<script>
const TXT="gemini-3.5-flash-lite",IMG="gemini-3.1-flash-image";
const PERSONA="Senin adın Siri. Samimi, sıcak, hafif esprili bir kadın yapay zekâ asistanısın. Kendini kadın olarak tanıt. En fazla 2 kısa cümleyle cevap ver. Konuşma diline uygun yaz; emoji, yıldız ve özel karakter kullanma.";
const FACEPROMPT="Photorealistic portrait photo of an original fictional adult woman, long wavy blonde hair, blue eyes, natural soft smile with lips closed, looking straight into the camera, face centered and large in frame, head and shoulders, neutral softly blurred background, natural soft light, vertical 3:4 composition.";
const $=i=>document.getElementById(i),err=m=>$("err").textContent=m||"";
let key=localStorage.getItem("gkey")||"";
const G=(m,a)=>`https://generativelanguage.googleapis.com/v1beta/models/${m}:${a}key=${key}`;
function askKey(){const k=prompt("Gemini API anahtarını yapıştır:",key);if(k!==null){key=k.trim();localStorage.setItem("gkey",key)}}
$("gear").onclick=()=>{askKey();if(key&&confirm("Yeni bir yüz oluşturulsun mu?"))makeFace()};

/* yüz üretimi */
const load=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
async function makeFace(){
  if(!key){askKey();if(!key)return}
  $("make").style.display="none";err("Yüz oluşturuluyor, 20-40 saniye sürebilir...");
  try{
    let r=await fetch(G(IMG,"generateContent?"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:FACEPROMPT}]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}})});
    let j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
    const p=(j.candidates?.[0]?.content?.parts||[]).find(x=>x.inlineData);if(!p)throw new Error("Resim gelmedi, tekrar dene.");
    const raw=await load(`data:${p.inlineData.mimeType};base64,${p.inlineData.data}`);
    const c=document.createElement("canvas");c.width=600;c.height=Math.round(600*raw.height/raw.width);c.getContext("2d").drawImage(raw,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",.88);
    r=await fetch(G(TXT,"generateContent?"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{inlineData:{mimeType:"image/jpeg",data:url.split(",")[1]}},{text:'Bu yüz fotoğrafında şu noktaları bul. Koordinatlar görüntünün sol üstüne göre 0-1000 arası (x genişlik, y yükseklik). Sadece JSON ver: {"leftEye":[x,y],"rightEye":[x,y],"mouth":[x,y],"mouthWidth":w}. leftEye görüntünün solundaki göz bebeği merkezi, mouth dudak çizgisinin ortası, mouthWidth ağzın genişliği (0-1000, x eksenine göre).'}]}],generationConfig:{responseMimeType:"application/json"}})});
    j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
    const lm=JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,""));
    localStorage.setItem("face",url);localStorage.setItem("lm",JSON.stringify(lm));
    err("");await start();
  }catch(e){err("Yüz oluşturulamadı: "+e.message);$("make").style.display="block"}
}
$("make").onclick=makeFace;

/* canlandırma */
const cv=$("cv"),ctx=cv.getContext("2d");let img,L,W,H,skin=["#e8c4b0","#e8c4b0"],blink=0,blinkT=2000,mo=0,talking=false;
const px=(a)=>[a[0]/1000*W,a[1]/1000*H];
function sample(x,y){const d=ctx.getImageData(Math.max(0,x-3),Math.max(0,y-3),6,6).data;let r=0,g=0,b=0,n=d.length/4;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}return`rgb(${r/n|0},${g/n|0},${b/n|0})`}
async function start(){
  const f=localStorage.getItem("face");if(!f){$("make").style.display="block";return}
  img=await load(f);L=JSON.parse(localStorage.getItem("lm"));W=cv.width=img.width;H=cv.height=img.height;
  ctx.drawImage(img,0,0);const e=[px(L.leftEye),px(L.rightEye)],ew=Math.hypot(e[1][0]-e[0][0],e[1][1]-e[0][1])*.4;
  skin=e.map(p=>sample(p[0],p[1]+ew*1.15));L.ew=ew;requestAnimationFrame(frame);
}
function eyes(){
  const e=[px(L.leftEye),px(L.rightEye)],ew=L.ew;
  e.forEach((p,i)=>{
    const rx=ew*.62,ry=ew*.34;ctx.save();ctx.beginPath();ctx.ellipse(p[0],p[1]-ry*.2,rx,ry*1.1,0,0,7);ctx.clip();
    const top=p[1]-ry*1.3,yl=top+blink*ry*2.4;ctx.fillStyle=skin[i];ctx.fillRect(p[0]-rx,top,rx*2,yl-top);
    if(blink>.15){ctx.strokeStyle="#3b2a22";ctx.lineWidth=ew*.07;ctx.beginPath();ctx.moveTo(p[0]-rx*.9,yl);ctx.quadraticCurveTo(p[0],yl+ew*.08,p[0]+rx*.9,yl);ctx.stroke()}
    ctx.restore();
  });
}
const oc=document.createElement("canvas");
function mouth(){
  const [mx,my]=px(L.mouth),mw=L.mouthWidth/1000*W,d=mo*mw*.3;if(d<1)return;
  ctx.save();ctx.fillStyle="#3a1219";ctx.beginPath();ctx.ellipse(mx,my+d/2,mw*.4,d/2+1.5,0,0,7);ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle="#f3efe9";ctx.fillRect(mx-mw*.4,my,mw*.8,Math.min(d*.38,mw*.07));ctx.restore();
  oc.width=W;oc.height=H;const o=oc.getContext("2d");
  o.drawImage(img,0,my,W,H-my,0,my+d,W,H-my);o.globalCompositeOperation="destination-in";
  const g=o.createRadialGradient(mx,my+mw*.45,mw*.2,mx,my+mw*.45,mw*.95);g.addColorStop(0,"#000");g.addColorStop(.6,"#000");g.addColorStop(1,"rgba(0,0,0,0)");
  o.fillStyle=g;o.fillRect(0,0,W,H);ctx.drawImage(oc,0,0);ctx.restore();
}
function frame(t){
  if(t>blinkT){blink=1;blinkT=t+2200+Math.random()*3500;setTimeout(()=>blink=.55,70);setTimeout(()=>blink=0,150)}
  const tg=talking?.2+.8*Math.abs(Math.sin(t/85)*Math.sin(t/190+1)):0;mo+=(tg-mo)*.4;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  const s=1.02+Math.sin(t/3000)*.006;ctx.translate(W/2+Math.sin(t/2300)*3,H/2+Math.sin(t/1700)*2.5);ctx.rotate(Math.sin(t/2900)*.006);ctx.scale(s,s);ctx.translate(-W/2,-H/2);
  ctx.drawImage(img,0,0,W,H);eyes();mouth();requestAnimationFrame(frame);
}

/* konuşma */
let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith("tr"));voice=v.find(x=>/female|kad[ıi]n|yelda|filiz/i.test(x.name))||v[0]||null}
speechSynthesis.onvoiceschanged=pick;pick();
function say(t){t=t.replace(/[*_#`]/g,"").trim();if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";if(voice)u.voice=voice;u.pitch=1.1;u.rate=1.05;
  u.onstart=()=>talking=true;u.onend=u.onerror=()=>{if(!speechSynthesis.pending)talking=false};speechSynthesis.speak(u)}
async function ask(text){
  if(!key){askKey();if(!key)return}err("");speechSynthesis.cancel();let buf="";
  try{
    const r=await fetch(G(TXT,"streamGenerateContent?alt=sse&"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({systemInstruction:{parts:[{text:PERSONA}]},contents:[{role:"user",parts:[{text}]}]})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||("Hata "+r.status))}
    const rd=r.body.getReader(),dec=new TextDecoder();let sse="";
    while(true){const{done,value}=await rd.read();if(done)break;sse+=dec.decode(value,{stream:true});const ls=sse.split("\n");sse=ls.pop();
      for(const ln of ls){if(!ln.startsWith("data:"))continue;try{buf+=JSON.parse(ln.slice(5)).candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||""}catch(e){}
        let m;while((m=buf.match(/^(.*?[.!?…])\s+/s))){say(m[1]);buf=buf.slice(m[0].length)}}}
    say(buf);
  }catch(e){err(e.message)}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false,heard="";
$("mic").onclick=()=>{
  if(!SR){err("Chrome kullan, bu tarayıcı sesle komutu desteklemiyor.");return}
  if(on){rec.stop();return}speechSynthesis.cancel();talking=false;
  rec=new SR();rec.lang="tr-TR";rec.interimResults=true;heard="";
  rec.onresult=e=>heard=Array.from(e.results).map(r=>r[0].transcript).join(" ");
  rec.onerror=e=>{if(e.error!=="no-speech"&&e.error!=="aborted")err("Mikrofon hatası: "+e.error)};
  rec.onend=()=>{on=false;$("mic").classList.remove("on");if(heard.trim())ask(heard.trim())};
  rec.start();on=true;$("mic").classList.add("on");err("");
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script></body></html>
