<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siri - Yapay Zekâ Asistanı</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1030;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        header {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #00d2ff;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .avatar-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px dashed #00d2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }
        .glow-effect {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,210,255,0.3) 0%, transparent 70%);
            transition: all 0.2s;
        }
        .wave-line {
            position: absolute;
            width: 90px;
            height: 4px;
            background-color: #00d2ff;
            border-radius: 2px;
            transition: all 0.1s;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover {
            background-color: rgba(0, 210, 255, 0.2);
        }
        .response-box {
            width: 80%;
            text-align: center;
            margin: 10px 0;
            font-size: 16px;
            color: #e2e8f0;
            min-height: 24px;
        }
        footer {
            margin-bottom: 40px;
        }
        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="title">Siri</div>
        <button style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">⚙</button>
    </header>

    <div class="main-container">
        <div class="avatar-circle">
            <div id="avatar-glow" class="glow-effect"></div>
            <div id="avatar-wave" class="wave-line"></div>
        </div>

        <div class="button-group">
            <button class="action-btn" onclick="alert('Yüz oluşturma modülü yakında!')">Yüzünü oluştur</button>
            <button class="action-btn" onclick="alert('Galeri açılıyor...')">Galeriden fotoğraf seç</button>
        </div>

        <div id="response-text" class="response-box">Siri hazır. Dinlemek için mikrofona bas.</div>
    </div>

    <footer>
        <button class="mic-btn" onclick="siriDinle()">🎤</button>
    </footer>

    <script>
        const API_KEY = 'AQ.Ab8RN6LKcI49Exbe_ibx4cR07c6asoO6g_fs5js3rainCxkw-A';
        const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
        const siri_karakteri = "Senin adın Siri. Zeki bir kadın yapay zekâ asistanısın. Kısa ve net cevaplar ver.";

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        function cihazAksiyonu(metin) {
            const komut = metin.toLowerCase();
            if (komut.includes("whatsapp") || komut.includes("watsap")) {
                window.location.href = "whatsapp://";
                return true;
            }
            if (komut.includes("ara") || komut.includes("telefon")) {
                const numara = komut.match(/\d+/);
                window.location.href = numara ? `tel:${numara}` : "tel:";
                return true;
            }
            return false;
        }

        let animInterval;
        function animasyonAc(calis) {
            const glow = document.getElementById('avatar-glow');
            const wave = document.getElementById('avatar-wave');
            if (calis) {
                animInterval = setInterval(() => {
                    let scale = 1 + Math.random() * 0.2;
                    let height = 4 + Math.random() * 20;
                    glow.style.transform = `scale(${scale})`;
                    wave.style.height = `${height}px`;
                }, 100);
            } else {
                clearInterval(animInterval);
                glow.style.transform = 'scale(1)';
                wave.style.height = '4px';
            }
        }

        function siriDinle() {
            const box = document.getElementById('response-text');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                box.innerText = "Səs tanıma brauzerinizdə dəstəklənmir.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            box.innerText = "Dinleyirəm...";

            recognition.onresult = async function(event) {
                const sesMetni = event.results[0][0].transcript;
                box.innerText = `Siz: "${sesMetni}"`;

                if (cihazAksiyonu(sesMetni)) return;

                animasyonAc(true);
                try {
                    const response = await fetch(URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${siri_karakteri}\nKullanıcı: ${sesMetni}` }] }]
                        })
                    });
                    const data = await response.json();
                    box.innerText = `Siri: ${data.candidates[0].content.parts[0].text}`;
                } catch (error) {
                    box.innerText = "Siri cevap veremedi, lütfen tekrar dene.";
                } finally {
                    animasyonAc(false);
                }
            };
            
            recognition.onerror = function() {
                box.innerText = "Ses gelmedi, tekrar deneyin.";
                animasyonAc(false);
            };
            
            recognition.start();
        }
    </script>
</body>
</html>
